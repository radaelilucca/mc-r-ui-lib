plugins {
    id 'net.minecraftforge.gradle'
    id 'idea'
}
base { archivesName = 'r-ui-lib-forge' }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(forge_java_version as int)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = forge_java_version as int }
minecraft {
    mappings channel: 'official', version: forge_minecraft_version
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('runs/client')
            mods { "${mod_id}" { source sourceSets.main } }
            if (project.hasProperty('uiValidation')) property 'r_ui_lib.validate', 'true'
            if (project.hasProperty('withJei')) property 'r_ui_lib.validateJei', 'true'
        }
        server {
            workingDirectory project.file('runs/server')
            args '--nogui'
            mods { "${mod_id}" { source sourceSets.main } }
        }
    }
}
dependencies {
    minecraft "net.minecraftforge:forge:${forge_minecraft_version}-${forge_version}"
    compileOnly "mezz.jei:jei-${forge_minecraft_version}-common-api:${forge_jei_version}"
    if (project.hasProperty('withJei')) runtimeOnly fg.deobf("mezz.jei:jei-${forge_minecraft_version}-forge:${forge_jei_version}")
}
processResources {
    def properties = [version: "${mod_version}+${forge_minecraft_version}", mod_id: mod_id,
        mod_name: mod_name, mod_description: mod_description, mod_authors: mod_authors,
        mod_license: mod_license, forge_version: forge_version, pack_format: 15]
    inputs.properties(properties)
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand(properties) }
}
jar { finalizedBy 'reobfJar' }
// Forge's development scanner requires a single local mod root.
sourceSets.each {
    def outputDirectory = layout.buildDirectory.dir("sourceSets/${it.name}")
    it.output.resourcesDir = outputDirectory
    it.java.destinationDirectory = outputDirectory
}
