plugins {
    id 'net.neoforged.moddev' version '2.0.144'
    id 'maven-publish'
}

repositories {
    maven { url = 'https://maven.blamejared.com' }
}

dependencies {
    compileOnly "mezz.jei:jei-1.21.1-common-api:${jei_version}"
}

group = mod_group_id
version = mod_version

base {
    archivesName = 'r-ui-lib-neoforge'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            gameDirectory = project.file('runs/client')
            programArgument '--quickPlaySingleplayer'
            programArgument 'New World'
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    def properties = [
        version: "${mod_version}+${minecraft_version}",
        mod_id: mod_id,
        mod_name: mod_name,
        mod_description: mod_description,
        mod_authors: mod_authors,
        mod_license: mod_license,
        minecraft_version: minecraft_version,
        neoforge_version: neoforge_version,
        neoforge_loader_version_range: neoforge_loader_version_range
    ]
    inputs.properties(properties)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(properties)
    }
    filesMatching('pack.mcmeta') {
        expand(properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

publishing {
    publications {
        rUiLib(MavenPublication) {
            from components.java
            groupId = mod_group_id
            artifactId = 'r-ui-lib-neoforge'
            pom {
                name = mod_name
                description = mod_description
                licenses {
                    license {
                        name = mod_license
                        url = 'https://opensource.org/license/mit'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'radaeli'
                        name = mod_authors
                    }
                }
            }
        }
    }

    repositories {
        mavenLocal()

        def releaseUrl = providers.gradleProperty('maven_release_url')
                .orElse(providers.environmentVariable('MAVEN_RELEASE_URL'))
                .getOrNull()
        if (releaseUrl) {
            maven {
                name = 'release'
                url = uri(releaseUrl)

                def releaseUsername = providers.gradleProperty('maven_username')
                        .orElse(providers.environmentVariable('MAVEN_USERNAME'))
                        .getOrNull()
                def releasePassword = providers.gradleProperty('maven_password')
                        .orElse(providers.environmentVariable('MAVEN_PASSWORD'))
                        .getOrNull()
                if (releaseUsername || releasePassword) {
                    credentials {
                        username = releaseUsername
                        password = releasePassword
                    }
                }
            }
        }
    }

}
