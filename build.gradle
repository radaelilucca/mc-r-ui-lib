plugins {
    id 'base'
    id 'net.minecraftforge.gradle' version '6.0.54' apply false
    id 'net.neoforged.moddev' version '2.0.144' apply false
}
allprojects {
    group = mod_group_id
    version = mod_version
}
tasks.register('buildAll') {
    group = 'build'
    description = 'Build and verify Forge 1.20.1 and NeoForge 1.21.1.'
    dependsOn ':forge:build', ':neoforge:build', 'verifyArtifacts'
}
tasks.register('verifyArtifacts', Exec) {
    group = 'verification'
    description = 'Verify loader metadata, Java bytecode, shared assets and source JARs.'
    dependsOn ':forge:assemble', ':neoforge:assemble'
    doFirst {
        def launcher = project(':neoforge').javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }.get()
        executable launcher.executablePath.asFile.absolutePath
        args rootProject.file('scripts/VerifyArtifacts.java').absolutePath, rootProject.projectDir.absolutePath, mod_version
    }
}
tasks.named('build') { dependsOn 'buildAll' }
tasks.named('check') { dependsOn ':forge:check', ':neoforge:check' }
tasks.named('assemble') { dependsOn ':forge:assemble', ':neoforge:assemble' }
tasks.named('clean') { dependsOn ':forge:clean', ':neoforge:clean' }
tasks.register('runForgeClient') { group = 'application'; dependsOn ':forge:runClient' }
tasks.register('runNeoForgeClient') { group = 'application'; dependsOn ':neoforge:runClient' }
tasks.register('runClient') { group = 'application'; dependsOn ':neoforge:runClient' }
tasks.register('runServer') { group = 'application'; dependsOn ':neoforge:runServer' }
subprojects {
    apply plugin: 'maven-publish'
    repositories { maven { url = 'https://maven.blamejared.com' } }
    plugins.withId('java') {
        sourceSets.main.java.srcDir rootProject.file('src/main/java')
        sourceSets.main.resources.srcDir rootProject.file('src/main/resources')
        tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
        dependencies { testImplementation 'junit:junit:4.13.2' }
        sourceSets.test.java.srcDir rootProject.file('src/test/java')
        publishing {
            publications {
                rUiLib(MavenPublication) {
                    from components.java
                    artifactId = "r-ui-lib-${project.name}"
                    pom {
                        name = mod_name
                        description = mod_description
                        licenses { license { name = mod_license; url = 'https://opensource.org/license/mit'; distribution = 'repo' } }
                        developers { developer { id = 'radaeli'; name = mod_authors } }
                    }
                }
            }
            repositories {
                mavenLocal()
                def releaseUrl = providers.gradleProperty('maven_release_url').orElse(providers.environmentVariable('MAVEN_RELEASE_URL')).getOrNull()
                if (releaseUrl) {
                    maven {
                        name = 'release'
                        url = uri(releaseUrl)
                        def user = providers.gradleProperty('maven_username').orElse(providers.environmentVariable('MAVEN_USERNAME')).getOrNull()
                        def pass = providers.gradleProperty('maven_password').orElse(providers.environmentVariable('MAVEN_PASSWORD')).getOrNull()
                        if (user || pass) credentials { username = user; password = pass }
                    }
                }
            }
        }
    }
}
