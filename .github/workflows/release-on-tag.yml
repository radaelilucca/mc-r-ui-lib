name: Build R-Ui Lib release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Newly created semantic tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate tag and build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          chmod +x ./gradlew
          ./gradlew -Pmod_version="${RELEASE_TAG#v}" build --no-daemon --no-parallel --console=plain
      - name: Collect library and source JARs
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mod_id="$(sed -nE 's/^mod_id=([^[:space:]]+)$/\1/p' gradle.properties)"
          mkdir -p release-artifacts
          for loader in forge neoforge; do
            if [[ "$loader" == forge ]]; then mc=1.20.1; else mc=1.21.1; fi
            cp "$loader/build/libs/r-ui-lib-${loader}-${version}.jar" "release-artifacts/${mod_id}-${mc}-${loader}-${version}.jar"
            cp "$loader/build/libs/r-ui-lib-${loader}-${version}-sources.jar" "release-artifacts/${mod_id}-${mc}-${loader}-${version}-sources.jar"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: r-ui-lib-${{ env.RELEASE_TAG }}
          path: release-artifacts/
          if-no-files-found: error
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --generate-notes --title "R-Ui Lib $RELEASE_TAG"
          gh release upload "$RELEASE_TAG" release-artifacts/*.jar --clobber
